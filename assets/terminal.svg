<svg viewBox="0 0 560 254" width="560" height="254" xmlns="http://www.w3.org/2000/svg">
  <!-- window -->
  <rect x="1" y="1" width="558" height="252" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <!-- traffic lights -->
  <circle cx="22" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="22" r="6" fill="#27c93f"/>
  <text x="280" y="26" font-family="Consolas,Menlo,monospace" font-size="11" fill="#8b949e" text-anchor="middle">fatih@akyol ~ zsh</text>

  <g font-family="Consolas,Menlo,monospace" font-size="13">
    <!-- line 1: $ whoami (typed) -->
    <clipPath id="t1"><rect x="20" y="48" width="0" height="18">
      <animate attributeName="width" from="0" to="90" begin="0.4s" dur="0.7s" fill="freeze"/>
    </rect></clipPath>
    <g clip-path="url(#t1)">
      <text x="20" y="62"><tspan fill="#27c93f">$</tspan><tspan fill="#c9d1d9" dx="6">whoami</tspan></text>
    </g>

    <!-- line 2: output -->
    <text x="20" y="86" fill="#58a6ff" opacity="0">senior frontend developer — react · next.js · typescript
      <animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 3: $ ls ~/web (typed) -->
    <clipPath id="t2"><rect x="20" y="102" width="0" height="18">
      <animate attributeName="width" from="0" to="100" begin="2.0s" dur="0.6s" fill="freeze"/>
    </rect></clipPath>
    <g clip-path="url(#t2)">
      <text x="20" y="116"><tspan fill="#27c93f">$</tspan><tspan fill="#c9d1d9" dx="6">ls ~/web</tspan></text>
    </g>

    <!-- line 4: output -->
    <text x="20" y="140" fill="#8b949e" opacity="0">chat  meet  whiteboard  code-editor  lynx  links  toolbox  typing
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 5: $ ls ~/desktop (typed) -->
    <clipPath id="t3"><rect x="20" y="156" width="0" height="18">
      <animate attributeName="width" from="0" to="130" begin="3.5s" dur="0.6s" fill="freeze"/>
    </rect></clipPath>
    <g clip-path="url(#t3)">
      <text x="20" y="170"><tspan fill="#27c93f">$</tspan><tspan fill="#c9d1d9" dx="6">ls ~/desktop</tspan></text>
    </g>

    <!-- line 6: output -->
    <text x="20" y="194" fill="#8b949e" opacity="0">clipboard-history  screen-splitter   <tspan fill="#58a6ff">(windows · macos)</tspan>
      <animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.3s" fill="freeze"/>
    </text>

    <!-- line 7: prompt + blinking cursor -->
    <text x="20" y="224" fill="#27c93f" opacity="0">$
      <animate attributeName="opacity" from="0" to="1" begin="4.9s" dur="0.2s" fill="freeze"/>
    </text>
    <rect x="34" y="212" width="8" height="15" fill="#c9d1d9" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;1;0;1;0" keyTimes="0;0.9;0.92;0.94;0.96;0.98;0.99;1" dur="5.3s" begin="0s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" begin="5.3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
